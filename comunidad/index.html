<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Comunidad 30X</title>
<meta name="description" content="Únete gratis a la comunidad de WhatsApp de 30X.">
<style>
:root{--bg:#0A0A0A;--surface:#1C1C1C;--fg:#F4F4F2;--soft:rgba(244,244,242,.72);--lime:#E9FF7B}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{max-width:420px;width:100%;background:var(--surface);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:28px;text-align:center}
.k{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--lime)}
h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:12px 0 8px}
p{color:var(--soft);margin:0 0 20px;font-size:16px}
a.btn{display:block;background:var(--lime);color:#000;font-weight:800;font-size:17px;padding:16px;border-radius:999px;text-decoration:none}
.sm{margin-top:14px;font-size:13px;color:rgba(244,244,242,.5)}
</style>
<script>
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init','871397058641901');fbq('track','PageView');
</script>
</head>
<body>
<main><div class="box">
<div class="k">Comunidad gratis · 30X</div>
<h1>Te estamos llevando a la comunidad de WhatsApp</h1>
<p id="msg">Un segundo…</p>
<a class="btn" id="btn" href="#" rel="noopener">Entrar al grupo de WhatsApp →</a>
<div class="sm">Si no se abre solo, toca el botón.</div>
</div></main>
<script>
(function(){
  var TOPE=1000;
  // Respaldo por si grupos.json no carga. Lo reescribe actualizar_grupos.py.
  var FALLBACK=/*FALLBACK*/["https://chat.whatsapp.com/BnwkKf18J0QIGoEuzuOxUc", "https://chat.whatsapp.com/FxsW0qZNBFeA52ql197BGf", "https://chat.whatsapp.com/G1Y7rNTqL3wIGS7ATz2sOJ", "https://chat.whatsapp.com/BobXwOBCHDI3HVdvpxjyVU", "https://chat.whatsapp.com/Ck33tiupjsQJhoGJv2ngYN", "https://chat.whatsapp.com/EzLqaJyEstWC6duAHzr00g", "https://chat.whatsapp.com/HWqGP2eJJrM9T2NjpuO7UX", "https://chat.whatsapp.com/GdbY9qpv8BhBGfDZ3n025A", "https://chat.whatsapp.com/GdpZ4a51EsGG0QhfTsnWdU"]/*END*/;
  var sp;try{sp=new URLSearchParams(location.search)}catch(e){sp=null}
  var utm=(sp&&sp.get('utm_content'))||'';var src=(sp&&sp.get('src'))||'';
  var btn=document.getElementById('btn'),msg=document.getElementById('msg'),done=false;
  function go(link,nombre){
    if(done)return;done=true;btn.href=link;msg.textContent='Te llevamos al grupo con cupo disponible.';
    try{fbq('trackCustom','Comunidad',{utm_content:utm,src:src,grupo:nombre||''})}catch(e){}
    // espera a que cargue el pixel (máx. 1,5 s) para que el evento salga antes de irse
    var t0=Date.now();(function esperar(){if((window.fbq&&window.fbq.callMethod)||Date.now()-t0>1500){setTimeout(function(){location.replace(link)},350)}else{setTimeout(esperar,100)}})();
  }
  function elegir(d){
    var t=(d&&d.tope)||TOPE,g=(d&&d.grupos)||[];
    for(var i=0;i<g.length;i++){if(g[i].link&&g[i].miembros<t)return g[i];}
    return null;
  }
  btn.href=FALLBACK[0];
  var to=setTimeout(function(){go(FALLBACK[0],'respaldo')},3500);
  fetch('grupos.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
    clearTimeout(to);var g=elegir(d);
    if(g)go(g.link,g.nombre);
    else{msg.textContent='Todos los grupos están llenos en este momento. Toca el botón para intentar con el último.';btn.href=(d.grupos[d.grupos.length-1]||{}).link||FALLBACK[0];}
  }).catch(function(){clearTimeout(to);go(FALLBACK[0],'respaldo')});
})();
</script>
</body>
</html>
